<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your clips</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#17150f;--mute:#6f6a5c;--line:#e7e2d4;--y:#fed50c;--g:#1c8a4a}
@media (prefers-color-scheme:dark){:root{--bg:#14130f;--card:#1e1c16;--ink:#f4f1e6;--mute:#a39e8d;--line:#322f25}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:220px}header small{display:block;color:var(--mute);font-weight:400;font-size:13px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--ink);background:var(--y);color:#17150f;padding:8px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.5;cursor:wait}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:24px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.off{opacity:.45}
.vid{position:relative;background:#000;aspect-ratio:9/16;max-height:520px;margin:0 auto;width:100%}.vid video{width:100%;height:100%;object-fit:contain;display:block}
.rank{position:absolute;top:10px;left:10px;background:var(--y);color:#17150f;font-weight:700;border-radius:999px;padding:2px 10px;font-size:13px}
.score{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px}
.body{padding:14px;display:flex;flex-direction:column;gap:10px}
.title{font:600 16px/1.3 inherit;width:100%;border:1px solid transparent;background:transparent;color:var(--ink);padding:4px;border-radius:8px}.title:focus{border-color:var(--line);outline:0;background:var(--bg)}
.why{color:var(--mute);font-size:13px;margin:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.nudge{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:2px 6px}.nudge b{min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.nudge button{padding:0 8px;border-radius:8px;border-color:var(--line);background:transparent;color:var(--ink);font-size:16px;line-height:24px}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
textarea{width:100%;font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;resize:vertical;min-height:64px}
input[type=text],input[type=range]{font:inherit;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 8px}input[type=range]{padding:0;width:90px}input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}.hookrow{flex-direction:column;align-items:stretch}.hookrow .row{margin:0}small.req{color:#b3261e;font-weight:600}
label.keep{display:flex;gap:6px;align-items:center;font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:60px 24px;text-align:center;color:var(--mute)}
</style></head><body>
<header><h1 id="h">Your clips<small id="sub"></small></h1><a class="btn" href="/api/zip" id="zip">Download kept clips (zip)</a></header>
<main id="grid"></main>
<script>
const $=s=>document.querySelector(s);let clips=[];
const t=s=>{s=Math.max(0,s);const m=Math.floor(s/60),r=s-m*60;return m+":"+r.toFixed(1).padStart(4,"0")};
async function post(url,body){const r=await fetch(url,{method:"POST",body:JSON.stringify(body)});return r.json()}
function draw(){
  const keep=clips.filter(c=>c.keep!==false).length;$("#zip").textContent=`Download ${keep} kept clip${keep==1?"":"s"} (zip)`;
  $("#grid").innerHTML=clips.length?"":'<div class="msg">No clips yet. Ask Claude to find the moments first.</div>';
  clips.forEach((c,i)=>{
    const el=document.createElement("div");el.className="card"+(c.keep===false?" off":"");
    el.innerHTML=`<div class="vid"><video controls muted playsinline preload="metadata" poster="/clips/${c.id}.jpg?v=${c.v||0}" src="/clips/${c.id}.mp4?v=${c.v||0}"></video><span class="rank">#${i+1}</span><span class="score">${c.score??""}/10</span></div>
    <div class="body"><input class="title" value="${(c.title||"").replace(/"/g,"&quot;")}" aria-label="Title">
    <p class="why">${c.reason||""}</p>
    <div class="row"><span>Start</span><span class="nudge"><button data-k="s" data-d="-1">−</button><b>${t(c.start)}</b><button data-k="s" data-d="1">+</button></span>
      <span>End</span><span class="nudge"><button data-k="e" data-d="-1">−</button><b>${t(c.end)}</b><button data-k="e" data-d="1">+</button></span></div>
    <div class="row"><span>Layout</span><select class="lay"><option value="fill">Fill the screen (follows the face)</option><option value="card">Card with hook on top</option><option value="brand">Whole frame on a colour</option><option value="blur">Whole frame on blur</option></select></div>
    <div class="row zm"><span>Zoom</span><input type="range" class="zoom" min="1" max="1.6" step="0.05" value="${c.zoom||1}"><b class="zv">${(c.zoom||1)}×</b></div>
    <div class="row bgr"><span>Colour</span><input type="color" class="bgc" value="${c.bg||"#FED50C"}"><input type="text" class="bgh" size="8" value="${c.bg||"#FED50C"}" aria-label="Colour code">
      ${["#FED50C","#111111","#ffffff","#1b2a49","#c0392b"].map(x=>`<button type="button" class="sw" data-c="${x}" style="background:${x}" aria-label="${x}"></button>`).join("")}</div>
    <div class="row hookrow"><span>Hook headline <small class="req"></small></span>
      <input type="text" class="hook" value="${(c.hook||"").replace(/"/g,"&quot;")}" placeholder="Type a hook, or pick a suggestion">
      <div class="row sug">${(c.hook_options||[]).map(o=>`<button type="button" class="ghost pick">${o.replace(/</g,"&lt;")}</button>`).join("")}</div></div>
    <div class="row"><span>Captions</span><select class="cap"><option value="original">Spoken words</option>${Object.keys(c.caption_sets||{}).map(k=>`<option value="set:${k}">${k}</option>`).join("")}<option value="none">No captions</option></select>
      <button class="ghost rr">Re-render</button></div>
    <textarea class="post" aria-label="Post caption">${c.post||c.hook||""}</textarea>
    <div class="actions"><label class="keep"><input type="checkbox" class="kp" ${c.keep===false?"":"checked"}> Keep</label>
      <button class="ghost cp">Copy caption</button><a class="btn ghost" download="${c.id}.mp4" href="/clips/${c.id}.mp4?v=${c.v||0}">Download</a></div></div>`;
    const q=s=>el.querySelector(s),lay=q(".lay");
    lay.value=c.layout==="crop"?"fill":(c.layout||"fill");q(".cap").value=c.captions||"original";
    const sync=()=>{const L=lay.value;q(".zm").style.display=(L==="fill"||L==="card")?"":"none";q(".bgr").style.display=(L==="brand"||L==="card")?"":"none";
      q(".req").textContent=L==="card"?"(required for this layout)":"(optional)"};sync();lay.onchange=sync;
    q(".zoom").oninput=e=>q(".zv").textContent=e.target.value+"×";
    const setc=v=>{q(".bgh").value=v;if(/^#[0-9a-f]{6}$/i.test(v))q(".bgc").value=v};
    q(".bgc").oninput=e=>setc(e.target.value);q(".bgh").oninput=e=>setc(e.target.value);el.querySelectorAll(".sw").forEach(b=>b.onclick=()=>setc(b.dataset.c));
    el.querySelectorAll(".pick").forEach(b=>b.onclick=()=>q(".hook").value=b.textContent);
    el.querySelector(".title").onchange=e=>post("/api/save",{id:c.id,title:e.target.value});
    el.querySelector(".post").onchange=e=>post("/api/save",{id:c.id,post:e.target.value});
    el.querySelector(".kp").onchange=e=>{c.keep=e.target.checked;post("/api/save",{id:c.id,keep:c.keep});draw()};
    el.querySelector(".cp").onclick=e=>{navigator.clipboard.writeText(el.querySelector(".post").value);e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy caption",1200)};
    el.querySelectorAll(".nudge button").forEach(b=>b.onclick=()=>{c[b.dataset.k==="s"?"start":"end"]+=+b.dataset.d;draw()});
    q(".rr").onclick=async e=>{const b=e.target;
      if(lay.value==="card"&&!q(".hook").value.trim()){q(".hook").focus();q(".req").textContent="(required: write or pick a hook)";return}
      b.disabled=true;b.textContent="Rendering…";
      const n=await post("/api/rerender",{id:c.id,start:c.start,end:c.end,layout:lay.value,zoom:+q(".zoom").value,bg:q(".bgh").value,hook:q(".hook").value.trim(),captions:q(".cap").value});Object.assign(c,n);draw()};
    $("#grid").appendChild(el)});
}
fetch("/api/state").then(r=>r.json()).then(s=>{clips=s.clips;$("#sub").textContent=(s.meta.title||"")+(s.meta.channel?" · "+s.meta.channel:"")+" · "+clips.length+" clips";draw()});
</script></body></html>
