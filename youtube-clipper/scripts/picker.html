<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your clips · Above Yellow</title>
<style>
/* Above Yellow design tokens (app/globals.css): achromatic ink on white, hairlines, Geist, capsule controls. */
@font-face{font-family:Geist;src:url(/assets/geist-subset.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Wordmark;src:url(/assets/bricolage-wordmark.woff2) format("woff2");font-weight:700}
:root{color-scheme:light;--ink:10 10 10;--ink-bright:23 23 23;--ink2:64 64 64;--ink3:115 115 115;--tint:245 245 245;--danger:192 57 43;--mark:#ff9900;
--hair:rgba(10,10,10,.1);--hair-soft:rgba(10,10,10,.06);--hair-strong:rgba(10,10,10,.18);
--r-inner:12px;--r-tile:16px;--r-card:20px;--lift:0 8px 28px -12px rgba(10,10,10,.28);
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
body{background:#fff;color:rgb(var(--ink));font:15px/1.5 Geist,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair-soft);padding:0 24px;min-height:68px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:13px;font:700 22px/1.15 Wordmark,Geist,sans-serif;letter-spacing:-.038em;color:rgb(var(--ink))}
.brand i{width:21px;height:21px;border-radius:50%;background:var(--mark);flex:none}
.ttl{flex:1;min-width:220px;padding-left:16px;border-left:1px solid var(--hair);line-height:1.3}
.ttl b{display:block;font:600 15px/1.3 Geist;letter-spacing:-.01em}.ttl span{font-size:13px;color:rgb(var(--ink3))}
.eyebrow,label.f>span:first-child{font:400 12px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:rgb(var(--ink3))}
button,.btn{font:600 15px/1 Geist,sans-serif;min-height:44px;padding:0 20px;border-radius:9999px;border:1px solid transparent;background:rgb(var(--ink));color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,background .2s,box-shadow .2s}
button:hover,.btn:hover{background:rgb(var(--ink-bright));transform:translateY(-1px);box-shadow:var(--lift)}button:active,.btn:active{transform:scale(.98)}
button.ghost,.btn.ghost{background:#fff;color:rgb(var(--ink));border-color:var(--hair-strong)}button.ghost:hover,.btn.ghost:hover{background:rgb(var(--tint));box-shadow:none;transform:none}
button:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
:is(button,.btn,select,input,textarea):focus-visible{outline:0;box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(10,10,10,.55)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;padding:32px 24px 64px;max-width:1480px;margin:auto}
.card{background:#fff;border:1px solid var(--hair);border-radius:var(--r-card);padding:8px;display:flex;flex-direction:column;gap:4px}
.card.off{opacity:.45}
.vid{position:relative;background:rgb(var(--tint));border-radius:var(--r-tile);overflow:hidden;aspect-ratio:9/16;width:100%}.vid video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.rank,.score{position:absolute;top:12px;font:400 12px/1 var(--mono);letter-spacing:.06em;padding:7px 10px;border-radius:9999px}
.rank{left:12px;background:rgb(var(--ink));color:#fff}.score{right:12px;background:rgba(255,255,255,.92);color:rgb(var(--ink));border:1px solid var(--hair)}
.body{padding:12px 8px 8px;display:flex;flex-direction:column;gap:14px}
.title{font:600 17px/1.3 Geist;letter-spacing:-.01em;width:100%;border:1px solid transparent;background:transparent;color:rgb(var(--ink));padding:6px 10px;margin:0 -10px;border-radius:var(--r-inner)}.title:hover{background:rgb(var(--tint))}.title:focus{outline:0;border-color:var(--hair-strong);background:#fff}
.why{color:rgb(var(--ink2));font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>span:first-child{min-width:64px}
.nudge{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--hair-strong);border-radius:9999px;padding:3px}.nudge b{min-width:60px;text-align:center;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.nudge button{min-height:32px;width:32px;padding:0;font-size:16px;background:rgb(var(--tint));color:rgb(var(--ink));box-shadow:none}.nudge button:hover{background:#e5e5e5;transform:none;box-shadow:none}
select,input[type=text],textarea{font:400 14px/1.3 Geist,sans-serif;color:rgb(var(--ink));background:#fff;border:1px solid var(--hair-strong);border-radius:9999px;padding:0 14px;min-height:40px}
select{padding-right:8px}textarea{border-radius:var(--r-tile);padding:12px 14px;width:100%;resize:vertical;min-height:84px;font-size:13px;line-height:1.5}
input[type=range]{accent-color:rgb(var(--ink));width:120px}input[type=checkbox]{accent-color:rgb(var(--ink));width:18px;height:18px}
input[type=color]{width:40px;height:40px;padding:3px;border:1px solid var(--hair-strong);border-radius:50%;background:#fff;cursor:pointer}
.sw{min-height:28px;width:28px;padding:0;border-radius:50%;border:1px solid var(--hair-strong);box-shadow:none}.sw:hover{transform:scale(1.1);box-shadow:none}
.hookrow{flex-direction:column;align-items:stretch;gap:8px}.hookrow input{border-radius:var(--r-inner);width:100%}
.hlang{min-height:32px;padding:0 12px;font-size:13px;font-weight:500}.hlang.on{background:rgb(var(--ink));color:#fff;border-color:rgb(var(--ink))}.sug{gap:6px}.sug .pick{min-height:34px;padding:0 14px;font-size:13px;font-weight:500;text-align:left}
small.req{color:rgb(var(--danger));font:600 12px Geist;letter-spacing:0;text-transform:none;margin-left:6px}
label.keep{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
hr.sep{border:0;border-top:1px solid var(--hair-soft);margin:0}
.msg{padding:80px 24px;text-align:center;color:rgb(var(--ink3))}
@media(max-width:560px){header{padding:8px 16px}main{padding:16px}.ttl{border:0;padding:0}}

/* list view */
.card .go{display:block;text-decoration:none;color:inherit;cursor:pointer}
.card .body{gap:10px}.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .meta .lay{font:400 12px var(--mono);letter-spacing:.06em;color:rgb(var(--ink3));text-transform:uppercase}
.card .title{pointer-events:none}
/* editor view */
.ed{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:32px;max-width:1180px;margin:0 auto;padding:24px 24px 64px;align-items:start}
.ed .left{position:sticky;top:92px}
.ed .vid{max-height:calc(100vh - 150px);width:auto;margin:0 auto;aspect-ratio:9/16;height:calc(100vh - 150px)}
.ed .vid.busy::after{content:"Rendering…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);font:600 15px Geist}
.ed .right{display:flex;flex-direction:column;gap:18px;min-width:0}
.crumb{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.nav{margin-left:auto;display:flex;gap:8px;align-items:center}.nav span{font:400 12px var(--mono);color:rgb(var(--ink3))}
.sec{border:1px solid var(--hair);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:14px}
.sec h3{font:400 12px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:rgb(var(--ink3))}
.ed .title{font-size:24px;letter-spacing:-.02em;padding:6px 10px;margin:0 -10px}
.ed .row>span:first-child{min-width:78px}
@media(max-width:860px){.ed{grid-template-columns:1fr;gap:16px;padding:16px}.ed .left{position:static}.ed .vid{height:auto;max-height:70vh}}
</style></head><body>
<header><a class="brand" href="#" style="text-decoration:none"><i></i>Above Yellow</a><div class="ttl"><b>Your clips</b><span id="sub"></span></div><a class="btn" href="/api/zip" id="zip">Download kept clips (zip)</a></header>
<div id="view"></div>
<script>
const $=s=>document.querySelector(s);let clips=[],meta={};
const t=s=>{s=Math.max(0,s);const m=Math.floor(s/60),r=s-m*60;return m+":"+r.toFixed(1).padStart(4,"0")};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const LAY={fill:"Fill the screen",card:"Card + hook",brand:"On a colour",blur:"On blur",crop:"Fill the screen"};
async function post(url,body){const r=await fetch(url,{method:"POST",body:JSON.stringify(body)});return r.json()}
const cur=()=>{const m=location.hash.match(/^#\/(c\d+)/);return m?m[1]:null};

function zipLabel(){const k=clips.filter(c=>c.keep!==false).length;$("#zip").textContent=`Download ${k} kept clip${k==1?"":"s"} (zip)`}

/* ---------- list ---------- */
function drawList(){
  $("#sub").textContent=(meta.title||"")+(meta.channel?" · "+meta.channel:"")+" · "+clips.length+" clips";
  const g=$("#view");g.className="";g.id="view";g.innerHTML='<main id="grid"></main>';
  const grid=$("#grid");if(!clips.length)grid.innerHTML='<div class="msg">No clips yet. Ask Claude to find the moments first.</div>';
  clips.forEach((c,i)=>{
    const el=document.createElement("div");el.className="card"+(c.keep===false?" off":"");
    el.innerHTML=`<a class="go" href="#/${c.id}"><div class="vid"><video muted playsinline preload="metadata" poster="/clips/${c.id}.jpg?v=${c.v||0}" src="/clips/${c.id}.mp4?v=${c.v||0}"></video><span class="rank">#${i+1}</span><span class="score">${c.score??""}/10</span></div></a>
    <div class="body"><input class="title" value="${esc(c.title)}" readonly tabindex="-1">
    <div class="meta"><span class="lay">${LAY[c.layout]||"Fill the screen"} · ${Math.round(c.end-c.start)}s</span><label class="keep"><input type="checkbox" ${c.keep===false?"":"checked"}> Keep</label></div>
    <p class="why">${esc(c.reason)}</p>
    <div class="actions"><a class="btn" href="#/${c.id}">Edit</a><a class="btn ghost" download="${c.id}.mp4" href="/clips/${c.id}.mp4?v=${c.v||0}">Download</a></div></div>`;
    el.querySelector(".keep input").onchange=e=>{c.keep=e.target.checked;post("/api/save",{id:c.id,keep:c.keep});el.classList.toggle("off",!c.keep);zipLabel()};
    const v=el.querySelector("video");el.querySelector(".go").onmouseenter=()=>{v.currentTime=0;v.muted=true;v.play().catch(()=>{})};el.querySelector(".go").onmouseleave=()=>{v.pause()};
    grid.appendChild(el)});
  zipLabel();window.scrollTo(0,0);
}

/* ---------- editor ---------- */
function drawEditor(id){
  const i=clips.findIndex(c=>c.id===id);if(i<0){location.hash="";return}
  const c=clips[i];
  const root=$("#view");root.innerHTML=`<div class="ed"><div class="left"><div class="vid"><video controls muted playsinline poster="/clips/${c.id}.jpg?v=${c.v||0}" src="/clips/${c.id}.mp4?v=${c.v||0}"></video></div></div>
  <div class="right">
    <div class="crumb"><a class="btn ghost" href="#">← All clips</a><div class="nav"><button class="ghost prev" ${i?"":"disabled"} aria-label="Previous clip">←</button><span>${i+1} / ${clips.length}</span><button class="ghost next" ${i<clips.length-1?"":"disabled"} aria-label="Next clip">→</button></div></div>
    <div><input class="title" value="${esc(c.title)}" aria-label="Title"><p class="why">${esc(c.reason)} <b>${c.score??""}/10</b></p></div>
    <div class="sec"><h3>Trim</h3><div class="row"><span class="eyebrow">Start</span><span class="nudge"><button data-k="s" data-d="-1">−</button><b class="sv">${t(c.start)}</b><button data-k="s" data-d="1">+</button></span>
      <span class="eyebrow">End</span><span class="nudge"><button data-k="e" data-d="-1">−</button><b class="ev">${t(c.end)}</b><button data-k="e" data-d="1">+</button></span></div></div>
    <div class="sec"><h3>Look</h3>
      <div class="row"><span class="eyebrow">Layout</span><select class="lay"><option value="fill">Fill the screen (follows the face)</option><option value="card">Card with hook on top</option><option value="brand">Whole frame on a colour</option><option value="blur">Whole frame on blur</option></select></div>
      <div class="row zm"><span class="eyebrow">Zoom</span><input type="range" class="zoom" min="1" max="1.6" step="0.05" value="${c.zoom||1}"><b class="zv">${c.zoom||1}×</b></div>
      <div class="row bgr"><span class="eyebrow">Colour</span><input type="color" class="bgc" value="${c.bg||"#FED50C"}"><input type="text" class="bgh" size="8" value="${c.bg||"#FED50C"}" aria-label="Colour code">
        ${["#FED50C","#111111","#ffffff","#1b2a49","#c0392b"].map(x=>`<button type="button" class="sw" data-c="${x}" style="background:${x}" aria-label="${x}"></button>`).join("")}</div>
      <div class="row hookrow"><span class="eyebrow">Hook headline<small class="req"></small></span><input type="text" class="hook" value="${esc(c.hook)}" placeholder="Type a hook, or pick a suggestion">
        <div class="row hl"><span class="eyebrow">Ideas in</span>${["Original","English","Hinglish","Hindi"].map(k=>`<button type="button" class="ghost hlang" data-l="${k}">${k==="Original"?"Spoken language":k}</button>`).join("")}<span class="why hmsg"></span></div>
        <div class="row sug"></div></div>
      <div class="row"><span class="eyebrow">Captions</span><select class="cap"><option value="original">Spoken words (as said)</option>${["English","Hinglish","Hindi"].map(k=>`<option value="set:${k}">${k}${(c.caption_sets||{})[k]?"":" (translates when chosen)"}</option>`).join("")}<option value="none">No captions</option></select><span class="why capmsg"></span></div>
      <div class="row"><button class="rr">Re-render this clip</button><span class="why rmsg"></span></div></div>
    <div class="sec"><h3>Post</h3><textarea class="post" aria-label="Post caption">${esc(c.post||c.first_line||"")}</textarea>
      <div class="actions"><label class="keep"><input type="checkbox" class="kp" ${c.keep===false?"":"checked"}> Keep</label><button class="ghost cp">Copy caption</button><a class="btn ghost dl" download="${c.id}.mp4" href="/clips/${c.id}.mp4?v=${c.v||0}">Download</a></div></div>
  </div></div>`;
  const q=s=>root.querySelector(s),lay=q(".lay");
  lay.value=c.layout==="crop"?"fill":(c.layout||"fill");q(".cap").value=c.captions||"original";
  const sync=()=>{const L=lay.value;q(".zm").style.display=(L==="fill"||L==="card")?"":"none";q(".bgr").style.display=(L==="brand"||L==="card")?"":"none";q(".req").textContent=L==="card"?"(required for this layout)":"(optional)"};sync();lay.onchange=sync;
  q(".zoom").oninput=e=>q(".zv").textContent=e.target.value+"×";
  const setc=v=>{q(".bgh").value=v;if(/^#[0-9a-f]{6}$/i.test(v))q(".bgc").value=v};
  q(".bgc").oninput=e=>setc(e.target.value);q(".bgh").oninput=e=>setc(e.target.value);root.querySelectorAll(".sw").forEach(b=>b.onclick=()=>setc(b.dataset.c));
  root.querySelectorAll(".pick").forEach(b=>b.onclick=()=>q(".hook").value=b.textContent);
  q(".title").onchange=e=>{c.title=e.target.value;post("/api/save",{id:c.id,title:c.title})};
  q(".post").onchange=e=>{c.post=e.target.value;post("/api/save",{id:c.id,post:c.post})};
  q(".kp").onchange=e=>{c.keep=e.target.checked;post("/api/save",{id:c.id,keep:c.keep});zipLabel()};
  q(".cp").onclick=e=>{navigator.clipboard.writeText(q(".post").value);e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy caption",1200)};
  root.querySelectorAll(".nudge button").forEach(b=>b.onclick=()=>{c[b.dataset.k==="s"?"start":"end"]+=+b.dataset.d;q(".sv").textContent=t(c.start);q(".ev").textContent=t(c.end);q(".rmsg").textContent="Trim changed. Re-render to see it."});

  const hookCache=l=>l==="Original"?(c.hook_options||[]):((c.hook_options_by_lang||{})[l]||[]);
  const showHooks=l=>{root.querySelectorAll(".hlang").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
    q(".sug").innerHTML=hookCache(l).map(o=>`<button type="button" class="ghost pick">${esc(o)}</button>`).join("");
    q(".sug").querySelectorAll(".pick").forEach(b=>b.onclick=()=>q(".hook").value=b.textContent)};
  root.querySelectorAll(".hlang").forEach(b=>b.onclick=async()=>{const l=b.dataset.l;
    if(!hookCache(l).length){q(".hmsg").textContent="Writing ideas…";root.querySelectorAll(".hlang").forEach(x=>x.disabled=true);
      const r=await fetch("/api/hooks",{method:"POST",body:JSON.stringify({id:c.id,lang:l,start:c.start,end:c.end})});const j=await r.json();
      root.querySelectorAll(".hlang").forEach(x=>x.disabled=false);
      if(j.error){q(".hmsg").textContent=j.error;return}
      if(l==="Original")c.hook_options=j;else(c.hook_options_by_lang=c.hook_options_by_lang||{})[l]=j;q(".hmsg").textContent=""}
    showHooks(l)});
  showHooks("Original");
  q(".cap").onchange=async e=>{const v=e.target.value;if(!v.startsWith("set:")||(c.caption_sets||{})[v.slice(4)])return;
    const l=v.slice(4);e.target.disabled=true;q(".capmsg").textContent="Translating "+l+"…";
    const r=await fetch("/api/translate",{method:"POST",body:JSON.stringify({id:c.id,lang:l,start:c.start,end:c.end})});const j=await r.json();e.target.disabled=false;
    if(j.error){q(".capmsg").textContent=j.error;e.target.value="original";return}
    (c.caption_sets=c.caption_sets||{})[l]=j;q(".capmsg").textContent=l+" captions ready. Press Re-render."};
  q(".prev").onclick=()=>location.hash="#/"+clips[i-1].id;q(".next").onclick=()=>location.hash="#/"+clips[i+1].id;
  q(".rr").onclick=async e=>{const b=e.target;
    if(lay.value==="card"&&!q(".hook").value.trim()){q(".hook").focus();q(".req").textContent="(required: write or pick a hook)";return}
    b.disabled=true;b.textContent="Rendering…";q(".vid").classList.add("busy");
    const n=await post("/api/rerender",{id:c.id,start:c.start,end:c.end,layout:lay.value,zoom:+q(".zoom").value,bg:q(".bgh").value,hook:q(".hook").value.trim(),captions:q(".cap").value});
    Object.assign(c,n);c.v=n.v;drawEditor(c.id)};
  window.scrollTo(0,0);
}
function route(){const id=cur();$("#zip").style.display="";id?drawEditor(id):drawList()}
window.addEventListener("hashchange",route);
fetch("/api/state").then(r=>r.json()).then(s=>{clips=s.clips;meta=s.meta;route()});
</script></body></html>
